<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css">
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/470/470199.png">
    <meta charset="UTF-8">
    <title>IMS App</title>
</head>

<style>
    body {
        overflow-x: hidden;
        scroll-behavior: smooth;
    }

    nav {
        background-color: navy !important;

    }

    .navbar-brand {
        color: whitesmoke !important;
        font-size: 30px !important;
        font-weight: bold;
    }

    .card {
        box-shadow: rgba(14, 30, 37, 0.12) 1px 2px 2px 0px, rgba(14, 30, 37, 0.32) 1px 2px 2px 0px;
    }

    .card-body {
        text-align: center;
    }

    .table-responsive {
        box-shadow: rgba(60, 64, 67, 0.3) 0px 1px 2px 0px, rgba(60, 64, 67, 0.15) 0px 2px 6px 2px;
    }

    th {
        text-align: center;
        font-size: 18px !important;
    }

    td {
        text-align: center;
        font-size: 15px;
        font-weight: 500;
    }

    label {
        font-weight: 500;
    }
</style>

<body>

<nav class="navbar navbar-expand-sm navbar-light mb-5">
    <div class="container">
        <a class="navbar-brand text-bold" href="#"><i class="fa fa-align-center"
                                                      aria-hidden="true">IMS</i></a>
    </div>
</nav>

<main>
    <div class="container p-4">
        <h4 class="text-center p-2 class=" p-1" mt-2"
        style="font-family:'Times New Roman', Times, serif; font-weight: bold;">Inventory Management
        System</h4>
        <div class="head_section">

            <div class="row row-cols-1 row-cols-md-4 g-3">
                <div class="col">
                    <a href="#exampleModalToggle1" data-bs-toggle="modal" role="button"
                       style="text-decoration: none; color: white;">
                        <div class="card h-100 bg-success">
                            <div class="card-body">
                                <h5 class="text-light"><i class="fa fa-plus"></i>&nbsp;Add Product</h5>
                            </div>
                        </div>
                    </a>
                </div>
<!--                <div class="col">-->
<!--                    <a href="#exampleModalToggle2" data-bs-toggle="modal" role="button"-->
<!--                       style="text-decoration: none; color: white;">-->
<!--                        <div class="card h-100 bg-primary">-->
<!--                            <div class="card-body">-->
<!--                                <h5 class="text-light"><i class="fa fa-area-chart"-->
<!--                                                          aria-hidden="true"></i>&nbsp;Update Product</h5>-->
<!--                            </div>-->
<!--                        </div>-->
<!--                    </a>-->
<!--                </div>-->
<!--                <div class="col">-->
<!--                    <a href="#exampleModalToggle3" data-bs-toggle="modal" role="button"-->
<!--                       style="text-decoration: none; color: white;">-->
<!--                        <div class="card h-100 bg-danger">-->
<!--                            <div class="card-body">-->
<!--                                <h5 class="text-light"><i class="fa fa-trash"></i>&nbsp;Delete Product</h5>-->
<!--                            </div>-->
<!--                        </div>-->
<!--                    </a>-->
<!--                </div>-->
                <div class="col">
                    <a href="#deleteAllModal4" data-bs-toggle="modal" role="button"
                       style="text-decoration: none; color: white;">
                        <div class="card h-100 bg-dark">
                            <div class="card-body">
                                <h5 class="text-light"><i class="fa fa-warning"></i>&nbsp;Delete All</h5>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
        <br>
        <div class="items_table mt-5 mb-4">
            <div class="table-responsive p-2">
                <h4 class="text-center p-2 class=" p-1" mt-2"
                style="font-family:'Times New Roman', Times, serif; font-weight: bold;">Inventories</h4>
                <table class="table table-bordered table-hover mt-5">
                    <thead class="bg-warning">

                    <th>SNO</th>
                    <th>ID</th>
                    <th>Name</th>
                    <th>quantuty</th>
                    <th>Price</th>
                    <th>Update|Delete</th>


                    </thead>
                    <tbody>
                    <tr th:each="product, index : ${products}">
                        <td th:text="${index.index + 1}"></td>
                        <td th:text="${product.id}"></td>
                        <td th:text="${product.name}"></td>
                        <td th:text="${product.quantity}"></td>
                        <td th:text="${product.price}"></td>
                           <td>


                            <div class="col">
                                <a href="#exampleModalToggle2" data-bs-toggle="modal" role="button"
                                                       style="text-decoration: none; color: white;">
                                                        <div class="card h-100 bg-primary">
                                                            <div class="card-body">
                                                                <h5 class="text-light"><i class="fa fa-area-chart"
                                                                                          aria-hidden="true"></i>&nbsp;Update Product</h5>
                                                            </div>
                                                        </div>
                                                    </a>
                                                </div>
                                                <div class="col">
                                                    <a href="#exampleModalToggle3" data-bs-toggle="modal" role="button"
                                                       style="text-decoration: none; color: white;">
                                                        <div class="card h-100 bg-danger">
                                                            <div class="card-body">
                                                                <h5 class="text-light"><i class="fa fa-trash"></i>&nbsp;Delete Product</h5>
                                                            </div>
                                                        </div>
                                                    </a>
                                                </div>
                        </td>

                            </form>
                        </td>

                    </tr>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>


<!-- model for create-->
<div class="modal fade" id="exampleModalToggle1" aria-hidden="true" aria-labelledby="exampleModalToggleLabel"
     tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body">
                <div th:if="${success}" class="alert alert-success" role="alert">
                    <p th:text="${success}"></p>
                </div>
                <form class="p-2" th:action="@{/create}" th:object="${product}" method="post">
                    <center>
                        <h4 style="font-family: 'Times New Roman', Times, serif;">Add Product</h4>
                    </center>

                    <div class="row p-2">
                        <label class="p-1" for="name">Product Name</label>
                        <input type="text" th:field="*{name}" class="form-control"
                               placeholder="product name" required>
                    </div>

                    <div class="row p-2">
                        <label class="p-1" for="quantity">Quantity</label>
                        <input type="text" th:field="*{quantity}" class="form-control"
                               placeholder="quantity" required>
                    </div>

                    <div class="row p-2">
                        <label class="p-1" for="price">Price</label>
                        <input type="tel" th:field="*{price}" class="form-control"
                               placeholder="price" required>
                    </div>



                    <button type="submit" class="btn btn-success mt-3 mb-2">Add Product</button>
                </form>
            </div>

        </div>
    </div>
</div>
</div>


<!-- model for update-->
<div class="modal fade" id="exampleModalToggle2" aria-hidden="true" aria-labelledby="exampleModalToggleLabel"
     tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body">
                <form class="p-2" th:action="@{/update}" th:object="${product}" method="post">
                    <!-- Check if errorMessage is present in the model and display it -->
                    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                        <p th:text="${errorMessage}"></p>
                    </div>

                    <center>
                        <h4 style="font-family: 'Times New Roman', Times, serif;">Update Product</h4>
                    </center>


                        <div class="row p-1">
                        <label class="p-1" for="id">Product ID</label>
                        <input type="text" th:text="*{id}" class="form-control" placeholder="product id" required>
                    </div>

                    <div class="row p-1">
                        <label class="p-1" for="Name"> Name</label>
                        <input type="text" th:field="*{name}" class="form-control"
                               placeholder="product name" required>
                    </div>

                    <div class="row p-1">
                        <label class="p-1" for="quantity">quantity</label>
                        <input type="text" th:field="*{quantity}" class="form-control"
                               placeholder="quantity" required>
                    </div>

                    <div class="row p-1">
                        <label class="p-1" for="price">Price</label>
                        <input type="tel" th:field="*{price}" class="form-control"
                               placeholder="price" required>
                    </div>



                    <button type="submit" class="btn btn-primary mt-3 mb-2">Update Product</button>
                </form>
            </div>

        </div>
    </div>
</div>
</div>


<!-- model for delete-->
<div class="modal fade" id="exampleModalToggle3" aria-hidden="true" aria-labelledby="exampleModalToggleLabel"
     tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body">
                <form class="p-2" th:action="@{/remove}" th:object="${product}" method="post">
                    <!-- Alert message -->
                    <div th:if="${alertMessage}" class="alert alert-danger">
                        <p th:text="${alertMessage}"></p>
                    </div>

                    <center>
                        <h4 style="font-family: 'Times New Roman', Times, serif;">Delete Product</h4>
                    </center>

                    <div class="row p-2">
                        <label class="p-1" for="id">Product ID</label>
                        <input type="text" th:field="*{id}" class="form-control" placeholder="product id" required>
                    </div>

                    <button type="submit" class="btn btn-danger mt-3 mb-2">Delete Product</button>
                </form>

            </div>

        </div>
    </div>
</div>
</div>

<!-- Delete All employees-->
<div class="modal fade" id="deleteAllModal4" aria-hidden="true" aria-labelledby="deleteAllModalLabe4" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body">
                <form class="p-2" th:action="@{/remove/all}" th:object="${confirmationForm}" method="post">
                    <center>
                        <h4 style="font-family: 'Times New Roman', Times, serif;">Delete All Product</h4>
                    </center>

                    <div class="row p-2">
                        <label class="p-3 text-warning" for="confirmation">Type 'Yes' For Confirmation</label>
                        <input type="text" th:field="*{confirmation}" class="form-control"
                               placeholder="confirmation" required>
                    </div>

                    <button type="submit" class="btn btn-dark mt-3 mb-2">Delete All Product</button>
                </form>
            </div>
        </div>
    </div>
</div>


<!-- bootstrap js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
